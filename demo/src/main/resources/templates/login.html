<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/css/login.css}" rel="stylesheet">
  <style>
    #stars-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: all;
      z-index: 0;
    }
    .main-container { position: relative; z-index: 1; }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<main class="main-container">
  <div class="center-wrapper">

    <header class="brand-header">
      <h1>ERP<span>.</span></h1>
      <p class="brand-sub">Sistema de Gestión Empresarial</p>
    </header>

    <article class="login-card">

      <div th:if="${error}" class="alert-error">
        <span>⚠</span>
        <span th:text="${error}"></span>
      </div>

      <div th:if="${exito}" class="alert-success">
        <span>✓</span>
        <span th:text="${exito}"></span>
      </div>

      <form th:action="@{/login}" method="post" id="loginForm" aria-label="Formulario de iniciar sesión">

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="email" placeholder="ejemplo@gmail.com"
                 autocomplete="email">
          <span class="error-message" id="errorCorreo"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••••"
                 autocomplete="current-password">
          <span class="error-message" id="errorPassword"></span>
        </div>

        <button type="submit" class="btn-login" id="btnLogin" disabled>
          Iniciar Sesión
        </button>

      </form>

      <nav class="create-account">
        <a th:href="@{/registro}">← Crear cuenta</a>
      </nav>

    </article>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    const canvas = document.getElementById('stars-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const STAR_COUNT   = 700;
    const HOVER_RADIUS = 120;
    const WARP_RADIUS  = 180;   // radio de distorsion gravitacional

    let stars = [];
    let mouse = { x: -9999, y: -9999 };

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function rand(min, max) { return min + Math.random() * (max - min); }

    function initStars() {
      stars = Array.from({ length: STAR_COUNT }, () => {
        const r    = Math.random();
        const size = r < 0.65 ? rand(0.2, 0.7)
                   : r < 0.88 ? rand(0.7, 1.4)
                   :              rand(1.4, 2.6);
        const base = rand(0.25, 1.0);
        return {
          // posicion original fija
          ox: rand(0, canvas.width),
          oy: rand(0, canvas.height),
          // posicion dibujada (con distorsion)
          x: 0, y: 0,
          size,
          baseAlpha:  base,
          alpha:      base,
          alphaDir:   Math.random() > 0.5 ? 1 : -1,
          alphaSpeed: rand(0.001, 0.006),
          // warp
          warpScale: 1,
          warpAngle: 0,
        };
      });
      // inicializa posicion
      stars.forEach(s => { s.x = s.ox; s.y = s.oy; });
    }

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const s of stars) {
        const dx   = s.ox - mouse.x;
        const dy   = s.ox - mouse.x; // recalculo abajo
        const ddx  = s.ox - mouse.x;
        const ddy  = s.oy - mouse.y;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy);

        // ── Efecto distorsion gravitacional ──
        if (dist < WARP_RADIUS && dist > 0) {
          const strength = Math.pow(1 - dist / WARP_RADIUS, 2.2);  // curva no lineal
          const angle    = Math.atan2(ddy, ddx);

          if (dist < HOVER_RADIUS * 0.4) {
            // zona central: repulsion (como agujero negro)
            const push = (1 - dist / (HOVER_RADIUS * 0.4)) * 30;
            s.x = s.ox + Math.cos(angle) * push;
            s.y = s.oy + Math.sin(angle) * push;
          } else {
            // zona exterior: atraccion + orbita
            const pull    = strength * 28;
            const swirl   = strength * 1.8;           // rotacion tipo vortex
            const newAngle = angle + Math.PI + swirl;  // atraido + torcido
            s.x = s.ox + Math.cos(angle) * (-pull) + Math.cos(newAngle - angle) * pull * 0.4;
            s.y = s.oy + Math.sin(angle) * (-pull) + Math.sin(newAngle - angle) * pull * 0.4;
          }

          // brillo proporcional a la distorsion
          s.alpha = Math.min(1, s.baseAlpha + strength * 0.7);
        } else {
          // fuera del radio: vuelve suave a origen
          s.x += (s.ox - s.x) * 0.08;
          s.y += (s.oy - s.y) * 0.08;

          // parpadeo natural
          s.alpha += s.alphaSpeed * s.alphaDir;
          if (s.alpha >= s.baseAlpha || s.alpha <= 0.1) s.alphaDir *= -1;
        }

        // ── Dibujo ──
        ctx.save();
        ctx.globalAlpha = s.alpha;

        const inWarp  = dist < WARP_RADIUS;
        const glowMult = inWarp ? Math.pow(1 - dist / WARP_RADIUS, 1.5) : 0;

        // halo para grandes o en zona warp
        if (s.size > 1.1 || glowMult > 0.1) {
          const glowR = s.size * (2.5 + glowMult * 6);
          const grad  = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowR);
          grad.addColorStop(0,   'rgba(255,255,255,0.95)');
          grad.addColorStop(0.25,'rgba(255,255,255,0.35)');
          grad.addColorStop(1,   'transparent');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(s.x, s.y, glowR, 0, Math.PI * 2);
          ctx.fill();
        }

        // punto central
        const drawR = s.size * (1 + glowMult * 1.2);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, drawR, 0, Math.PI * 2);
        ctx.fill();

        // rayos de luz en zona muy cercana
        if (dist < HOVER_RADIUS * 0.7 && s.size > 0.5) {
          const armLen  = s.size * (4 + glowMult * 10);
          const opacity = glowMult * 0.6;
          ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
          ctx.lineWidth   = 0.6;
          // 4 brazos rotados levemente con el tiempo
          const rot = Date.now() * 0.0004;
          for (let i = 0; i < 4; i++) {
            const a = rot + (Math.PI / 4) * i;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x + Math.cos(a) * armLen, s.y + Math.sin(a) * armLen);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      requestAnimationFrame(tick);
    }

    function start() {
      resize();
      initStars();
      tick();
    }

    canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
    window.addEventListener('resize', () => { resize(); initStars(); });
    start();
  })();
</script>
<script th:src="@{/js/login.js}" defer></script>
</body>
</html>
