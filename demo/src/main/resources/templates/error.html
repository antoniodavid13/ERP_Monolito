<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
            radial-gradient(ellipse at 20% 50%, rgba(57, 217, 217, 0.07) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 20%, rgba(136, 87, 255, 0.05) 0%, transparent 50%),
            radial-gradient(ellipse at 50% 80%, rgba(248, 81, 73, 0.05) 0%, transparent 50%);
        animation: bgShift 15s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(-30px, -20px) rotate(3deg); }
    }

    .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(57, 217, 217, 0.3);
        border-radius: 50%;
        animation: float linear infinite;
    }

    .particle:nth-child(odd) { background: rgba(136, 87, 255, 0.25); }
    .particle:nth-child(3n) { background: rgba(57, 217, 217, 0.2); }

    @keyframes float {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(57, 217, 217, 0.1), transparent);
        animation: scanline 8s linear infinite;
        z-index: 0;
        pointer-events: none;
    }

    @keyframes scanline {
        0% { top: -3px; }
        100% { top: 100%; }
    }

    .error-container {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 40px;
        max-width: 560px;
    }

    .error-logo {
        width: 90px;
        height: 90px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(57, 217, 217, 0.12), rgba(136, 87, 255, 0.12));
        border: 1px solid rgba(57, 217, 217, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        position: relative;
        animation: logoPulse 4s ease-in-out infinite;
    }

    .error-logo::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(57, 217, 217, 0.2), transparent, rgba(136, 87, 255, 0.2));
        z-index: -1;
        filter: blur(12px);
        opacity: 0.6;
    }

    @keyframes logoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }

    .error-logo svg {
        width: 42px;
        height: 42px;
        color: #39d9d9;
        opacity: 0.9;
    }

    .error-title {
        font-size: 26px;
        font-weight: 700;
        color: #e6edf3;
        margin-bottom: 14px;
        letter-spacing: -0.5px;
    }

    .error-message {
        font-size: 15px;
        color: #8b949e;
        line-height: 1.8;
        margin-bottom: 44px;
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
    }

    .divider {
        width: 50px;
        height: 3px;
        background: linear-gradient(90deg, #39d9d9, #8857ff);
        border-radius: 3px;
        margin: 0 auto 44px;
    }

    .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 44px;
        background: linear-gradient(135deg, #39d9d9, #2dd4bf);
        border: none;
        border-radius: 12px;
        color: #0d1117;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Poppins', sans-serif;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
    }

    .btn-home::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
    }

    .btn-home:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px rgba(57, 217, 217, 0.35);
    }

    .btn-home:hover::before {
        left: 100%;
    }

    .btn-home:active {
        transform: translateY(-1px);
    }

    .btn-home svg {
        width: 20px;
        height: 20px;
        transition: transform 0.3s;
    }

    .btn-home:hover svg {
        transform: translateX(-3px);
    }

    .footer-text {
        margin-top: 48px;
        font-size: 12px;
        color: #484f58;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="scanline"></div>

<div class="particles">
  <div class="particle" style="left: 8%; animation-duration: 9s; animation-delay: 0s; width: 3px; height: 3px;"></div>
  <div class="particle" style="left: 22%; animation-duration: 12s; animation-delay: 1.2s; width: 5px; height: 5px;"></div>
  <div class="particle" style="left: 37%; animation-duration: 10s; animation-delay: 2.4s;"></div>
  <div class="particle" style="left: 52%; animation-duration: 11s; animation-delay: 0.6s; width: 6px; height: 6px;"></div>
  <div class="particle" style="left: 68%; animation-duration: 8s; animation-delay: 3.1s;"></div>
  <div class="particle" style="left: 78%; animation-duration: 13s; animation-delay: 1.8s; width: 3px; height: 3px;"></div>
  <div class="particle" style="left: 88%; animation-duration: 9s; animation-delay: 2.8s; width: 5px; height: 5px;"></div>
  <div class="particle" style="left: 42%; animation-duration: 14s; animation-delay: 4.2s;"></div>
</div>

<div class="error-container">

  <div class="error-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>

  <h1 class="error-title">¡Oops! Algo no fue bien</h1>

  <div class="divider"></div>

  <p class="error-message">
    Ha ocurrido un problema inesperado en el sistema.
    No te preocupes, puedes volver al inicio y continuar
    gestionando tu negocio con normalidad.
  </p>

  <a th:href="@{/dashboard}" class="btn-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>
    </svg>
    Volver al Inicio
  </a>

  <p class="footer-text">ERP Sistema de Gestión</p>
</div>

</body>
</html>
